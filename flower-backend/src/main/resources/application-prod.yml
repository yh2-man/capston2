storage:
  upload-dir: /home/ubuntu/app/uploads
  base-url: https://ourt.kro.kr

spring:
  web:
    resources:
      static-locations: file:/home/ubuntu/app/uploads/,classpath:/static/
  mvc:
    static-path-pattern: /uploads/**
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false


