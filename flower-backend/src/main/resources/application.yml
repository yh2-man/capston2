spring:
  application:
    name: flower-backend
  profiles:
    include: auth
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: false
  web:
    resources:
      static-locations: file:uploads/,classpath:/static/
  mvc:
    static-path-pattern: /uploads/**

# 로컬 개발용 기본값 (운영에서는 환경변수로 대체됨)
