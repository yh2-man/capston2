spring:
  application:
    name: flower-backend
  profiles:
    include: auth
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: false
  web:
    resources:
      static-locations: file:uploads/,classpath:/static/
  mvc:
    static-path-pattern: /uploads/**

# 운영 환경변수는 GitHub Secrets에서 주입됨
# 로컬에서는 비워두거나 직접 export하여 사용
KAKAO_CLIENT_ID:
KAKAO_CLIENT_SECRET:
JWT_SECRET: change-me-for-local-development-only

app:
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:true}

storage:
  upload-dir: uploads
  base-url: http://localhost:8080

chatbot:
  openai:
    api-key: ${OPENAI_API_KEY:}

nongsaro:
  api-key: ${NONGSARO_API_KEY:}

plantid:
  api-key: ${PLANTID_API_KEY:}
  api-url: https://api.plant.id/v3/identification

tmap:
  transit:
    app-key: ${TMAP_API_KEY:}
