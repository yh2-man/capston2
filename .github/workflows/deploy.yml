name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main, feature/app-ui ]
    paths:
      - 'flower-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: JAR 빌드
        run: |
          cd flower-backend
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: 서버에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app
            sudo systemctl stop ourt-backend || true

      - name: JAR 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "flower-backend/build/libs/*.jar"
          target: "~/app"
          strip_components: 3

      - name: 지도 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "flower_app/assets/map/*"
          target: "~/app/map"
          strip_components: 3

      - name: 서버 시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            printf 'SPRING_PROFILES_ACTIVE=prod\nKAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}\nKAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}\nJWT_SECRET=${{ secrets.JWT_SECRET }}\nDB_URL=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require\nDB_USERNAME=postgres.eycyfnteenxtrumzfyya\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nORACLE_NAMESPACE=${{ secrets.ORACLE_NAMESPACE }}\nORACLE_BUCKET=${{ secrets.ORACLE_BUCKET }}\nORACLE_REGION=${{ secrets.ORACLE_REGION }}\nOPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}\n' > ~/app/app.env
            sudo systemctl restart ourt-backend
            echo "서버 시작 완료"
