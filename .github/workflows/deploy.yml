name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main, feature/app-ui ]
    paths:
      - 'flower-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: JAR 빌드
        run: |
          cd flower-backend
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: 서버에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app
            sudo systemctl stop ourt-backend || true

      - name: JAR 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "flower-backend/build/libs/*.jar"
          target: "~/app"
          strip_components: 3

      - name: 서버 시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export SPRING_PROFILES_ACTIVE=prod
            export KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            export KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            nohup java -jar ~/app/*.jar \
              --spring.profiles.active=prod \
              --KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }} \
              --KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }} \
              --JWT_SECRET=${{ secrets.JWT_SECRET }} \
              --DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              > ~/app/app.log 2>&1 &
            echo "서버 시작 완료"
