name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main, feature/app-ui ]
    paths:
      - 'flower-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: JAR 빌드
        run: |
          cd flower-backend
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: 서버에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app
            sudo systemctl stop ourt-backend || true

      - name: JAR 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "flower-backend/build/libs/*.jar"
          target: "~/app"
          strip_components: 3

      - name: 지도 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "flower_app/assets/map/*"
          target: "~/app/map"
          strip_components: 3

      - name: 서버 시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "SPRING_PROFILES_ACTIVE=prod" > ~/app/app.env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> ~/app/app.env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> ~/app/app.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ~/app/app.env
            echo "DB_URL=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require" >> ~/app/app.env
            echo "DB_USERNAME=postgres.eycyfnteenxtrumzfyya" >> ~/app/app.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ~/app/app.env
            echo "ORACLE_NAMESPACE=${{ secrets.ORACLE_NAMESPACE }}" >> ~/app/app.env
            echo "ORACLE_BUCKET=${{ secrets.ORACLE_BUCKET }}" >> ~/app/app.env
            echo "ORACLE_REGION=${{ secrets.ORACLE_REGION }}" >> ~/app/app.env
            echo "NONGSARO_API_KEY=${{ secrets.NONGSARO_API_KEY }}" >> ~/app/app.env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> ~/app/app.env
            sudo systemctl restart ourt-backend
            echo "서버 시작 완료"
